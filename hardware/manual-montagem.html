<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual de Montagem do Mascote</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: tres colunas no computador (passos | desenho e passo atual | pecas e multimetro).
   O desenho e o texto nascem do mesmo modelo de pecas e fios, entao ligar ou desligar
   uma peca muda o desenho, a lista de redes e o que o multimetro virtual mede.
   Cores dos fios: laranja SPI, azul I2C, verde I2S, vermelho 3V3, cinza GND. */
:root {
  --bg: #e9ebee; --surface: #f6f7f9; --surface2: #eceef1; --fg: #1d2024; --muted: #5f6670; --line: #cfd3d9;
  --accent: #d97757; --accent-fg: #ffffff; --good: #23864f; --bad: #c93030; --warn: #b9770e;
  --w-spi: #c4561f; --w-i2c: #2a63c4; --w-i2s: #23864f; --w-pwr: #c93030; --w-gnd: #4b525b;
  --bb: #eef0f2; --bb-edge: #b9bec6; --hole: #a3aab4; --gap: #dfe2e6;
  --pcb: #1d2b2a; --pcb-edge: #0f1818; --pcb-fg: #e8efe9; --pcb-dim: #7f918c; --chip: #aeb4ba; --gold: #d6b25e;
  --lcd: #b8c9a6;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1d2024; --surface2: #23272c; --fg: #e8eaed; --muted: #9aa1aa; --line: #2f343a;
    --accent: #e08562; --accent-fg: #1a0e08; --good: #5cc58a; --bad: #f26b6b; --warn: #e0a64a;
    --w-spi: #ef8a5a; --w-i2c: #6fa3f2; --w-i2s: #5cc58a; --w-pwr: #f26b6b; --w-gnd: #aab1ba;
    --bb: #2a2e33; --bb-edge: #3a4047; --hole: #5b636c; --gap: #22262a;
    --pcb: #16211f; --pcb-edge: #050a0a; --chip: #8d949b; --lcd: #9fb08d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1d2024; --surface2: #23272c; --fg: #e8eaed; --muted: #9aa1aa; --line: #2f343a;
  --accent: #e08562; --accent-fg: #1a0e08; --good: #5cc58a; --bad: #f26b6b; --warn: #e0a64a;
  --w-spi: #ef8a5a; --w-i2c: #6fa3f2; --w-i2s: #5cc58a; --w-pwr: #f26b6b; --w-gnd: #aab1ba;
  --bb: #2a2e33; --bb-edge: #3a4047; --hole: #5b636c; --gap: #22262a;
  --pcb: #16211f; --pcb-edge: #050a0a; --chip: #8d949b; --lcd: #9fb08d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
button { font: inherit; color: inherit; }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
header.top { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: end; justify-content: space-between; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 6px 0 0; font: 700 26px/1.1 var(--font-display); }
h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
h3 { margin: 0; font: 500 11px/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
b { font-weight: 600; }
code { font: 13px var(--font-mono); background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
.parts-tabs { display: flex; gap: 8px; }
.tab { appearance: none; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: 500 13px/1 var(--font-body); }
.tab[aria-pressed="true"], .tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab:disabled { opacity: .5; cursor: not-allowed; }
a.tab { text-decoration: none; color: inherit; display: inline-block; }
.tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); width: 0; transition: width .2s; }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.col-l, .col-r { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow: auto; }

/* lista de passos */
.stage-name { font: 500 11px/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 0 4px; }
.step-btn { appearance: none; width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: start; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; font-size: 13px; line-height: 1.35; }
.step-btn:hover { background: var(--surface2); }
.step-btn[aria-current="step"] { background: var(--surface2); border-color: var(--fg); }
.step-btn .n { font: 500 11px/1.6 var(--font-mono); color: var(--muted); }
.step-btn.done .n::after { content: " ✓"; color: var(--good); }
.step-btn.done .t { color: var(--muted); }

/* desenho */
.viewbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.segs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.segs button { appearance: none; border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font: 500 13px/1 var(--font-body); }
.segs button + button { border-left: 1px solid var(--line); }
.segs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.canvas { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.canvas svg { display: block; height: auto; }
.canvas svg.fit { max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend .gh { background: none; border-top: 2px dashed var(--muted); height: 0; }
svg text { font-family: var(--font-mono); font-size: 11px; fill: var(--fg); }
svg .t-dim { fill: var(--muted); }
svg .t-title { font-family: var(--font-body); font-size: 12px; font-weight: 600; }
svg .t-pcb { fill: var(--pcb-fg); }
svg .t-pcbdim { fill: var(--pcb-dim); }
svg .t-bad { fill: var(--bad); font-weight: 500; }
svg .t-good { fill: var(--good); font-weight: 500; }
svg .t-w { fill: #fff; }
.pt { cursor: pointer; }
.pt:hover .ring, .pt:focus-visible .ring { stroke: var(--accent); stroke-width: 2; }
.pt:focus-visible { outline: none; }
.ring { fill: transparent; stroke: transparent; }
.wire.future { opacity: .17; }
.wire.off { opacity: .85; }
.cur-halo { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .cur-halo { animation: none; } }

/* painel do passo */
.step-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.badge { font: 500 11px/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); color: var(--muted); }
.badge.opt { color: var(--warn); border-color: var(--warn); }
.sec { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.sec > p, .sec > ul { max-width: 78ch; }
.sec ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.gl { appearance: none; background: none; border: 0; padding: 0; cursor: help; color: inherit; border-bottom: 1px dotted var(--accent); font: inherit; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.btn { appearance: none; cursor: pointer; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font: 500 14px/1 var(--font-body); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { appearance: none; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font: 500 14px/1 var(--font-body); }
.opt.right { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.opt.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.note { border-left: 3px solid var(--accent); background: var(--surface2); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14px; max-width: 78ch; }
.note.good { border-color: var(--good); }
.note.bad { border-color: var(--bad); }
.codewrap { min-width: 0; }
.codewrap .cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 500 12px/1 var(--font-mono); color: #8d96a1; background: #0d0f11; padding: 8px 10px; border-radius: 8px 8px 0 0; }
.codewrap .cap button { background: transparent; color: #e3e6ea; border: 1px solid #3a4047; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: 500 12px/1 var(--font-body); }
pre.code { margin: 0; background: #0d0f11; color: #e3e6ea; padding: 12px 14px; border-radius: 0 0 8px 8px; overflow: auto; max-height: 360px; font: 12.5px/1.55 var(--font-mono); tab-size: 2; }
pre.code code, pre.mini code { background: transparent; padding: 0; font: inherit; color: inherit; }
pre.mini { margin: 0; background: #0d0f11; color: #e3e6ea; padding: 8px 12px; border-radius: 6px; overflow: auto; font: 12.5px/1.5 var(--font-mono); }
.block { display: grid; gap: 6px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font: 500 11px/1.2 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); }
td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
details > summary { cursor: pointer; font-weight: 600; }
textarea, select, input[type=text] { width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 13px var(--font-body); }
label.fld { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }

/* pecas */
.parts-grp { display: grid; gap: 4px; }
.part { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 4px; border-radius: 6px; font-size: 13px; line-height: 1.3; }
.part.cur { background: var(--surface2); }
.sw { appearance: none; position: relative; width: 38px; height: 22px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.sw[aria-checked="true"] { background: var(--good); border-color: var(--good); }
.sw[aria-checked="true"]::after { left: 18px; background: #fff; }
.part small { display: block; color: var(--muted); font-size: 11px; }
.part .off { color: var(--bad); }

/* multimetro */
.mm { display: grid; gap: 10px; }
.mm-body { background: #2d3036; border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.mm-lcd { background: var(--lcd); color: #1d2024; border-radius: 6px; padding: 8px 12px; text-align: right; font: 600 30px/1.1 var(--font-mono); min-height: 56px; display: flex; justify-content: space-between; align-items: center; }
.mm-lcd small { font: 500 11px/1.2 var(--font-mono); text-align: left; }
.mm .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mm .seg2 { display: inline-flex; border-radius: 8px; overflow: hidden; border: 1px solid #4a4f58; }
.mm .seg2 button { flex: 1; background: transparent; color: #e3e6ea; border: 0; padding: 8px 6px; cursor: pointer; font: 500 12px/1.2 var(--font-body); }
.mm .seg2 button + button { border-left: 1px solid #4a4f58; }
.mm .seg2 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.probe-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.beep { font: 700 12px/1 var(--font-mono); padding: 3px 7px; border-radius: 4px; background: #0b0c0e; color: #666; }
.beep.on { background: var(--good); color: #fff; }
.mm-explain { font-size: 13px; color: var(--fg); }
.warn { color: var(--bad); font-size: 13px; }

/* glossario */
.gl-pop { position: fixed; z-index: 50; max-width: 320px; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.gl-pop b { display: block; margin-bottom: 2px; }
.hint { font: 500 12px/1.4 var(--font-mono); color: var(--muted); }

@media (max-width: 1180px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .col-l, .col-r { position: static; max-height: none; }
}
@media (max-width: 560px) { h1 { font-size: 20px; } }
@media (max-width: 1180px) { #steps { max-height: 260px; overflow: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">manual interativo · parte 1 · protoboard</div>
      <h1>Manual de Montagem do Mascote</h1>
    </div>
    <div class="parts-tabs" role="group" aria-label="Partes do manual">
      <button class="tab" type="button" aria-pressed="true">Parte 1 · Protoboard</button>
      <a class="tab" href="manual-placa-ilhada.html">Parte 2 · Placa ilhada</a>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><i id="progress"></i></div>

  <div class="app">
    <aside class="col col-l" aria-label="Passos">
      <div class="card"><h3>Passos</h3><div id="steps"></div>
        <button class="btn" type="button" id="resetAll">Recomeçar do zero</button>
      </div>
    </aside>

    <main class="col" id="main">
      <div class="card">
        <div class="viewbar">
          <div class="segs" id="views" role="group" aria-label="Vista do circuito">
            <button type="button" data-view="phys" aria-pressed="true">Física (protoboard)</button>
            <button type="button" data-view="blocks" aria-pressed="false">Blocos</button>
            <button type="button" data-view="sym" aria-pressed="false">Símbolos</button>
          </div>
          <div class="segs" id="zoom" role="group" aria-label="Zoom">
            <button type="button" data-z="1" aria-pressed="true">100%</button>
            <button type="button" data-z="1.4" aria-pressed="false">140%</button>
            <button type="button" data-z="1.8" aria-pressed="false">180%</button>
          </div>
        </div>
        <div class="canvas" id="canvas"></div>
        <div class="legend" id="legend"></div>
        <p class="hint" id="viewhint"></p>
      </div>
      <div class="card" id="stepcard"></div>
    </main>

    <aside class="col col-r" aria-label="Peças e multímetro">
      <div class="card"><h3>Peças e fios</h3>
        <p class="hint">Cada interruptor liga ou desliga a peça no desenho e no multímetro. Desligue uma para ver o que deixa de funcionar.</p>
        <div id="parts"></div>
        <div id="conseq"></div>
        <button class="btn" type="button" id="resetOv">Voltar ao passo atual</button>
      </div>
      <div class="card mm" id="mm"></div>
    </aside>
  </div>
</div>

<script type="text/plain" id="code-etapa1">// Etapa 1: confirma que a placa é N16R8 (PSRAM de 8 MB e flash de 16 MB).
// Abra o Monitor Serial em 115200.

void setup() {
  Serial.begin(115200);
  delay(1500);
  Serial.println();
  Serial.printf("Chip:  %s, %d MHz\n", ESP.getChipModel(), ESP.getCpuFreqMHz());
  Serial.printf("PSRAM: %u bytes (esperado: perto de 8388608)\n", ESP.getPsramSize());
  Serial.printf("Flash: %u bytes (esperado: perto de 16777216)\n", ESP.getFlashChipSize());
}

void loop() {}
</script>
<script type="text/plain" id="code-etapa2_3">// Etapas 2 e 3: tela ST7796 (SPI) e touch (I2C).
// Etapa 2: deixe USAR_TOUCH em 0 e veja as cores na tela.
// Etapa 3: troque USAR_TOUCH para 1; cada toque desenha um ponto e imprime x e y.
// Biblioteca: LovyanGFX (Gerenciador de Bibliotecas).
// Touch GT911 em vez de FT6336: troque Touch_FT5x06 por Touch_GT911 e i2c_addr por 0x5D.

#define USAR_TOUCH 0

#define LGFX_USE_V1
#include <LovyanGFX.hpp>

// Pinos (docs/montagem.md)
constexpr int PIN_SCK = 12, PIN_MOSI = 11, PIN_MISO = 13, PIN_DC = 14;
constexpr int PIN_CS = 10, PIN_RST = 6, PIN_BL = 7;
constexpr int PIN_SDA = 8, PIN_SCL = 9, PIN_TP_INT = 4, PIN_TP_RST = 5;

class LGFX : public lgfx::LGFX_Device {
  lgfx::Panel_ST7796 _panel;
  lgfx::Bus_SPI _bus;
  lgfx::Light_PWM _light;
  lgfx::Touch_FT5x06 _touch;  // o chip FT6336 usa este driver

public:
  LGFX() {
    {
      auto cfg = _bus.config();
      cfg.spi_host = SPI2_HOST;
      cfg.spi_mode = 0;
      cfg.freq_write = 40000000;
      cfg.freq_read = 16000000;
      cfg.pin_sclk = PIN_SCK;
      cfg.pin_mosi = PIN_MOSI;
      cfg.pin_miso = PIN_MISO;
      cfg.pin_dc = PIN_DC;
      _bus.config(cfg);
      _panel.setBus(&_bus);
    }
    {
      auto cfg = _panel.config();
      cfg.pin_cs = PIN_CS;
      cfg.pin_rst = PIN_RST;
      cfg.pin_busy = -1;
      cfg.panel_width = 320;   // a tela é 320x480 "em pé"; setRotation(1) deixa 480x320
      cfg.panel_height = 480;
      cfg.offset_x = 0;
      cfg.offset_y = 0;
      cfg.offset_rotation = 0;
      cfg.readable = false;
      cfg.invert = false;      // se as cores saírem invertidas (preto vira branco), troque para true
      cfg.rgb_order = false;   // se vermelho e azul saírem trocados, troque para true
      cfg.dlen_16bit = false;
      cfg.bus_shared = false;
      _panel.config(cfg);
    }
    {
      auto cfg = _light.config();
      cfg.pin_bl = PIN_BL;
      cfg.invert = false;
      cfg.freq = 44100;
      cfg.pwm_channel = 7;
      _light.config(cfg);
      _panel.setLight(&_light);
    }
#if USAR_TOUCH
    {
      auto cfg = _touch.config();
      cfg.x_min = 0;
      cfg.x_max = 319;
      cfg.y_min = 0;
      cfg.y_max = 479;
      cfg.pin_int = PIN_TP_INT;
      cfg.bus_shared = false;
      cfg.offset_rotation = 0;
      cfg.i2c_port = 0;
      cfg.i2c_addr = 0x38;     // FT6336
      cfg.pin_sda = PIN_SDA;
      cfg.pin_scl = PIN_SCL;
      cfg.freq = 400000;
      _touch.config(cfg);
      _panel.setTouch(&_touch);
    }
#endif
    setPanel(&_panel);
  }
};

LGFX tft;

void setup() {
  Serial.begin(115200);
  delay(1000);

#if USAR_TOUCH
  // reinicia o chip do touch antes de iniciar a tela
  pinMode(PIN_TP_RST, OUTPUT);
  digitalWrite(PIN_TP_RST, LOW);
  delay(10);
  digitalWrite(PIN_TP_RST, HIGH);
  delay(100);
#endif

  tft.init();
  tft.setRotation(1);       // paisagem, 480x320
  tft.setBrightness(200);

  // 1) as três cores, nesta ordem: vermelho, verde, azul
  const uint32_t cores[] = {TFT_RED, TFT_GREEN, TFT_BLUE};
  for (uint32_t c : cores) {
    tft.fillScreen(c);
    delay(800);
  }

  // 2) moldura e texto
  tft.fillScreen(TFT_BLACK);
  tft.drawRect(0, 0, tft.width(), tft.height(), TFT_WHITE);
  tft.setTextColor(TFT_WHITE, TFT_BLACK);
  tft.setTextSize(3);
  tft.setCursor(24, 24);
  tft.print("Mascote Claude");
  tft.setTextSize(2);
  tft.setCursor(24, 80);
  tft.printf("Tela %dx%d ok", tft.width(), tft.height());
#if USAR_TOUCH
  tft.setCursor(24, 112);
  tft.print("Toque na tela");
#endif
}

void loop() {
#if USAR_TOUCH
  int32_t x, y;
  if (tft.getTouch(&x, &y)) {
    tft.fillCircle(x, y, 6, TFT_YELLOW);

<script type="text/plain" id="code-etapa3_i2c_scan">// Etapa 3 (diagnóstico): procura o chip do touch no I2C.
// Esperado: 0x38 (FT6336) ou 0x5D / 0x14 (GT911).

constexpr int PIN_SDA = 8, PIN_SCL = 9, PIN_TP_RST = 5;

#include <Wire.h>

void setup() {
  Serial.begin(115200);
  delay(1500);

  // sem este reset o chip do touch pode não responder
  pinMode(PIN_TP_RST, OUTPUT);
  digitalWrite(PIN_TP_RST, LOW);
  delay(10);
  digitalWrite(PIN_TP_RST, HIGH);
  delay(100);

  Wire.begin(PIN_SDA, PIN_SCL);
  Serial.println("Procurando dispositivos I2C...");
  int achados = 0;
  for (uint8_t endereco = 1; endereco < 127; endereco++) {
    Wire.beginTransmission(endereco);
    if (Wire.endTransmission() == 0) {
      Serial.printf("achei: 0x%02X\n", endereco);
      achados++;
    }
  }
  Serial.printf("%d dispositivo(s) encontrado(s)\n", achados);
}

void loop() {}
</script>
<script type="text/plain" id="code-etapa4_microfone">// Etapa 4: lê o microfone INMP441 pelo I2S e mostra o volume no Serial.
// Precisa do núcleo esp32 (Espressif) versão 3.0 ou mais nova.
// Esperado: o número e a barra sobem quando você bate palma perto.

#include <ESP_I2S.h>

constexpr int PIN_BCLK = 15, PIN_WS = 16, PIN_MIC_DATA = 17;

I2SClass i2s;

void setup() {
  Serial.begin(115200);
  delay(1500);

  i2s.setPins(PIN_BCLK, PIN_WS, -1, PIN_MIC_DATA);  // sem saída de áudio (-1)
  // o INMP441 manda 24 bits dentro de uma palavra de 32; L/R no GND = canal esquerdo
  if (!i2s.begin(I2S_MODE_STD, 16000, I2S_DATA_BIT_WIDTH_32BIT, I2S_SLOT_MODE_MONO, I2S_STD_SLOT_LEFT)) {
    Serial.println("Falha ao iniciar o I2S. Confira os fios SCK, WS e SD.");
    while (true) delay(1000);
  }
  Serial.println("Microfone pronto. Bata palma perto dele.");
}

void loop() {
  int32_t amostras[256];
  size_t n = i2s.readBytes((char *)amostras, sizeof(amostras)) / sizeof(int32_t);
  if (n == 0) return;

  // volume = desvio médio em relação à média (tira o nível contínuo do microfone)
  int64_t soma = 0;
  for (size_t i = 0; i < n; i++) soma += amostras[i] >> 14;
  int32_t media = soma / (int64_t)n;
  int64_t desvio = 0;
  for (size_t i = 0; i < n; i++) desvio += abs((amostras[i] >> 14) - media);
  int32_t volume = desvio / (int64_t)n;

  int barra = constrain(volume / 100, 0, 60);
  Serial.printf("%6d ", (int)volume);
  for (int i = 0; i < barra; i++) Serial.print('#');
  Serial.println();
}
</script>

  // ----- etapa 3
  step({ stage: 3, type: 'action', title: 'Desligue o USB', adds: [], usb: false,

    why: 'Mesma regra de sempre: nunca mexa em fio com a placa energizada.' });

  step({ stage: 3, type: 'code', title: 'Procure o touch com o scanner', adds: [], usb: true, code: 'etapa3_i2c_scan', showPins: ['i2c'],

           ['Achou 0x5D ou 0x14', 'É GT911: troque Touch_FT5x06 por Touch_GT911 e i2c_addr pelo endereço achado.']],

  // ----- etapa 4
  step({ stage: 4, type: 'action', title: 'Desligue o USB', adds: [], usb: false,
    do: ['Desconecte o USB antes de montar o microfone.'], why: 'Sempre sem energia ao mexer em fios.' });

  MIC.forEach((w, k) => {

                goal: `o pino ${w.pin} do microfone e ${w.gpio ? 'o GPIO ' + w.gpio + ' do ESP32' : 'o trilho ' + w.net} estão ligados` },
      ifNot: e.cons });
  });
  step({ stage: 4, type: 'action', title: 'Curto, USB e energia do microfone', adds: [], usb: true,
    do: ['Antes: continuidade 3V3 contra GND, **sem apitar**. Ligue o USB.',

    why: 'Confirma que o microfone está alimentado antes de procurar problemas no som.',
    verify: { mode: 'volt', a: 'mic:VDD', b: 'mic:GND', usb: true, goal: 'o microfone recebe 3,3 V entre VDD e GND' },
    ifNot: 'Se marcar 0 V, falta o fio de VDD ou o de GND do microfone.' });
  step({ stage: 4, type: 'code', title: 'Grave o teste do microfone', adds: [], usb: true, code: 'etapa4_microfone', showPins: ['i2s'],
    ok: 'O Monitor Serial mostra números baixos no silêncio. Quando você bate palma perto, o número e a barra de # sobem.',
    fail: [['Sempre zero', 'L/R solto (precisa ir ao GND) ou SD no GPIO errado.'],
           ['Ruído alto e constante', 'Fios longos. Aproxime o microfone do ESP32 e encurte os jumpers.'],
           ['Falha ao iniciar o I2S', 'Confira SCK (GPIO 15) e WS (GPIO 16) e se o pacote esp32 é 3.0 ou mais novo.']],
    blocks: [
      ['i2s.setPins(PIN_BCLK, PIN_WS, -1, PIN_MIC_DATA);', 'Diz à biblioteca quais fios do {{I2S}} você montou. O -1 significa "sem saída de áudio" (não há alto-falante).'],
      ['i2s.begin(I2S_MODE_STD, 16000, I2S_DATA_BIT_WIDTH_32BIT, I2S_SLOT_MODE_MONO, I2S_STD_SLOT_LEFT)', 'Liga o microfone a 16 mil amostras por segundo. "SLOT_LEFT" é o canal esquerdo, escolhido pelo L/R no GND.'],
      ['size_t n = i2s.readBytes((char *)amostras, sizeof(amostras)) / sizeof(int32_t);', 'Lê um pacote de amostras de som.'],
      ['desvio += abs((amostras[i] >> 14) - media);', 'Calcula o volume: o quanto o som se afasta do nível médio. Palma dá número grande, silêncio dá número pequeno.']
    ] });

  const STEP_OF = {};
  STEPS.forEach(s => (s.adds || []).forEach(id => { STEP_OF[id] = s.idx; }));
  // usb nominal de cada passo
  STEPS.forEach(s => { s.usbNom = !!s.usb; });

  // =====================================================================================
  // 2. REDES: uniao dos pontos ligados e o que o multimetro mede
  // =====================================================================================
  class UF {
    constructor() { this.p = new Map(); }
    find(x) { if (!this.p.has(x)) this.p.set(x, x); let r = x; while (this.p.get(r) !== r) r = this.p.get(r); let c = x; while (this.p.get(c) !== r) { const n = this.p.get(c); this.p.set(c, r); c = n; } return r; }
    union(a, b) { const ra = this.find(a), rb = this.find(b); if (ra !== rb) this.p.set(ra, rb); }
  }
  function buildNets(on, usb) {
    const uf = new UF();
    if (on.has('esp')) {
      for (let i = 0; i < 22; i++) { uf.union(`esp:L${i}`, `bbB:${BB_C0 + i}`); uf.union(`esp:R${i}`, `bbT:${BB_C0 + i}`); }
      uf.union('esp:L0', 'esp:L1');                                           // os dois pinos 3V3 sao o mesmo fio
      ['esp:R0', 'esp:R20', 'esp:R21'].forEach(n => uf.union('esp:L21', n));  // todos os GND da placa sao o mesmo
    }
    if (on.has('mic')) MIC.forEach((w, k) => uf.union(`mic:${w.pin}`, `bbB:${MIC_C0 + k}`));
    Object.values(E).forEach(e => { if (e.kind === 'wire' && on.has(e.id)) uf.union(e.a, e.b); });
    const volt = new Map(); let short = false;
    if (on.has('esp')) {
      const gnd = uf.find('esp:L21'); volt.set(gnd, 0);
      if (usb) {
        const v33 = uf.find('esp:L0'), v5 = uf.find('esp:L20');
        if (v33 === gnd) short = true;
        else volt.set(v33, 3.3);
        if (v5 !== gnd && !volt.has(v5)) volt.set(v5, 5.0);
      }
    }
    return { uf, volt, short, usb, on };
  }
  const POINT_LABEL = {};
  const regLabel = (node, label) => { POINT_LABEL[node] = label; };
  LEFT.forEach((p, i) => regLabel(`esp:L${i}`, /^\d+$/.test(p) ? `ESP32 · GPIO ${p}` : `ESP32 · ${p}${i === 1 ? ' (2º)' : ''}`));
  RIGHT.forEach((p, i) => regLabel(`esp:R${i}`, /^\d+$/.test(p) ? `ESP32 (lado direito) · GPIO ${p}` : `ESP32 (lado direito) · ${p}`));
  TELA.forEach(w => regLabel(`tela:${w.pin}`, `Tela · ${w.pin}`));
  MIC.forEach(w => regLabel(`mic:${w.pin}`, `Microfone · ${w.pin}`));
  regLabel('rail:3V3', 'Trilho 3V3'); regLabel('rail:GND', 'Trilho GND');
  for (let c = 4; c <= 35; c++) regLabel(`bbB:${c}`, `Furo livre da coluna ${c}`);
  const nodeAvail = (n, on) => n.startsWith('esp:') ? on.has('esp') : n.startsWith('tela:') ? on.has('tela') : n.startsWith('mic:') ? on.has('mic') : n.startsWith('bbB:') ? (parseInt(n.slice(4), 10) >= BB_C0 ? on.has('esp') : parseInt(n.slice(4), 10) < BB_C0 + 22 ? true : true) : true;

  function netName(nets, node) {
    const r = nets.uf.find(node), names = [];
    const probe = ['esp:L0', 'esp:L20', 'esp:L21', 'rail:3V3', 'rail:GND'];
    if (nets.uf.find('esp:L21') === r) return 'GND';
    if (nets.uf.find('esp:L0') === r || nets.uf.find('rail:3V3') === r) return '3V3';
    if (nets.uf.find('esp:L20') === r) return '5V';
    TELA.concat(MIC).forEach(w => { if (w.gpio) { const n = (TELA.includes(w) ? 'tela:' : 'mic:') + w.pin; if (nets.uf.find(n) === r) names.push(`${TELA.includes(w) ? 'Tela' : 'Microfone'} ${w.pin}`); } });
    for (let i = 0; i < 22; i++) if (/^\d+$/.test(LEFT[i]) && nets.uf.find(`esp:L${i}`) === r) names.unshift(`GPIO ${LEFT[i]}`);
    return names.length ? names.join(' ↔ ') : 'um ponto solto';
  }
  function measure(nets, mode, a, b) {
    const ra = nets.uf.find(a), rb = nets.uf.find(b), same = ra === rb;
    if (mode === 'cont') {
      return { beep: same, disp: same ? '0.0' : 'OL', unit: 'Ω', warnPower: nets.usb,
        why: same ? `Os dois pontos estão na mesma rede elétrica (${netName(nets, a)}): há um caminho de metal entre eles, então o multímetro apita.`
                  : `Os dois pontos estão em redes diferentes (${netName(nets, a)} e ${netName(nets, b)}): não há caminho de metal entre eles, então não apita (OL = circuito aberto).` };
    }
    // tensao
    if (!nets.usb) return { beep: false, disp: '0.00', unit: 'V', why: 'O USB está desligado: não há energia no circuito, então qualquer tensão vale 0 V.' };
    if (nets.short) return { beep: false, disp: '0.00', unit: 'V', why: 'Há um curto entre 3V3 e GND: a tensão desaba, o regulador esquenta e a placa pode reiniciar. Desligue o USB.', warn: true };
    const va = nets.volt.get(ra), vb = nets.volt.get(rb);
    if (va === undefined || vb === undefined) {
      const un = va === undefined ? a : b;
      return { beep: false, disp: '——', unit: 'V', why: `${POINT_LABEL[un] || un} é um sinal ou um ponto solto: a tensão ali depende do programa que o ESP32 está rodando (pode ser 0 V ou 3,3 V) ou fica instável se estiver solto.` };
    }
    const v = va - vb;
    return { beep: false, disp: (v < 0 ? '-' : '') + Math.abs(v).toFixed(2), unit: 'V', why: `Ponta vermelha em ${netName(nets, a)} (${va.toFixed(1)} V) e preta em ${netName(nets, b)} (${vb.toFixed(1)} V): a diferença é ${pt(v.toFixed(2))} V.` };
  }
  const resultLabel = (mode, m) => mode === 'cont' ? (m.beep ? 'Apita (ligados)' : 'Não apita (separados)') : (m.disp === '0.00' ? '0 V' : m.disp === '3.30' ? '3,3 V' : m.disp === '5.00' ? '5 V' : pt(m.disp) + ' V');

  // =====================================================================================
  // 3. ESTADO
  // =====================================================================================
  const KEY = 'mascote.manual.v1';
  const S = { cur: 0, done: [], view: 'phys', ov: {}, usbOv: null, zoom: 1, mode: 'cont', red: null, black: null, pick: 'red', ans: {}, report: false };
  try { const d = JSON.parse(localStorage.getItem(KEY) || '{}'); Object.assign(S, { cur: Math.min(d.cur || 0, STEPS.length - 1), done: d.done || [], view: d.view || 'phys', ov: d.ov || {}, zoom: d.zoom || 1, ans: d.ans || {} }); } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ cur: S.cur, done: S.done, view: S.view, ov: S.ov, zoom: S.zoom, ans: S.ans })); } catch (_) {} };
  const nominalOn = id => E[id].step <= S.cur;
  const effOn = id => S.ov[id] === undefined ? nominalOn(id) : S.ov[id];
  const onSet = () => new Set(Object.keys(E).filter(effOn));
  const usbNow = () => S.usbOv === null ? STEPS[S.cur].usbNom : S.usbOv;
  const nominalSet = k => new Set(Object.keys(E).filter(id => E[id].step <= k));
  const elState = id => effOn(id) ? 'on' : (nominalOn(id) ? 'off' : 'future');
  const curIds = () => new Set(STEPS[S.cur].adds || []);

  // =====================================================================================
  // 4. TEXTO RICO E GLOSSARIO
  // =====================================================================================
  const GLOSS = {
    GND: ['GND (terra)', 'A referência de 0 V e o caminho de volta da corrente de toda peça. Sem ele, as tensões não têm com o que ser comparadas.'],
    '3V3': ['3V3', 'O fio de alimentação de 3,3 V. Sai do regulador do ESP32 e alimenta tela, touch e microfone.'],
    trilho: ['Trilho', 'Linha de furos ligados ao longo de toda a protoboard, usada para distribuir 3V3 e GND sem repetir fios.'],
    curto: ['Curto-circuito', 'Ligação direta entre dois pontos que não deviam se tocar, como 3V3 e GND. A corrente fica enorme e queima peças.'],
    regulador: ['Regulador', 'Chip da placa que baixa os 5 V do USB para 3,3 V. A diferença vira calor.'],
    'multímetro': ['Multímetro', 'Aparelho que mede tensão, continuidade e resistência. Em continuidade ele apita quando dois pontos estão ligados por metal.'],
    SPI: ['SPI', 'Barramento rápido de poucos fios (relógio, dados de ida, dados de volta, seleção) usado para mandar a imagem à tela.'],
    I2C: ['I2C', 'Barramento de 2 fios compartilhados (dados e relógio), usado aqui para ler o chip do touch.'],
    I2S: ['I2S', 'Barramento feito para áudio digital: relógio dos bits, marcador esquerdo/direito e dados.'],
    CS: ['CS (Chip Select)', 'Fio que avisa à tela que a conversa é com ela. Fica em nível baixo enquanto o ESP32 fala.'],
    DC: ['DC (Data/Command)', 'Fio que diz se o próximo byte é um comando ou um pixel.'],
    SCK: ['SCK (relógio)', 'Cada pulso deste fio marca um bit. Dá o ritmo da conversa.'],
    MOSI: ['MOSI / SDI', 'Dados do ESP32 para o outro chip. Na tela chama-se SDI.'],
    MISO: ['MISO / SDO', 'Dados do outro chip para o ESP32. Na tela chama-se SDO.'],
    WS: ['WS (Word Select)', 'No I2S, marca o começo de cada amostra e diz se é canal esquerdo ou direito.'],
    'pull-up': ['Pull-up', 'Resistor que empurra uma linha para o nível alto (3V3) quando ninguém a puxa para baixo.'],
    PSRAM: ['PSRAM', 'Memória extra do ESP32 (8 MB no N16R8), usada para imagens e áudio.'],
    'Monitor Serial': ['Monitor Serial', 'Janela da Arduino IDE que mostra as mensagens que o ESP32 envia pelo cabo USB.']
  };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rich = t => esc(t)
    .replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g, (m, k, label) => GLOSS[k] ? `<button type="button" class="gl" data-gl="${esc(k)}">${label || k}</button>` : (label || k))
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');

  // =====================================================================================
  // 5. DESENHOS
  // =====================================================================================
  // ---- geometria da protoboard (vista fisica) ----
  const bx = c => 48 + (c - 1) * 14;
  const ROW = { j: 82, i: 96, h: 110, g: 124, f: 138, e: 180, d: 194, c: 208, b: 222, a: 236 };
  const RAIL_Y = { '3V3': 264, 'GND': 278 };
  const TELA_Y = 400, TELA_X0 = 150, TELA_P = 46;
  const SPRITE = ['...############...', '...############...', '.################.', '...############...', '....#.#....#.#....'];
  const mascot = (x, y, px, py) => { let s = ''; SPRITE.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === '#') s += `<rect x="${x + c * px}" y="${y + r * py}" width="${px}" height="${py}" fill="#d97757" shape-rendering="crispEdges"/>`; }); return s + [5, 12].map(c => `<rect x="${x + c * px}" y="${y + py}" width="${px}" height="${py}" fill="#141210" shape-rendering="crispEdges"/>`).join(''); };

  // posicao de cada no no desenho fisico (para pontas de prova e fios)
  function physXY(node) {
    if (node === 'rail:3V3') return [bx(46), RAIL_Y['3V3']];
    if (node === 'rail:GND') return [bx(46), RAIL_Y.GND];
    if (node.startsWith('bbB:')) return [bx(+node.slice(4)), ROW.a];
    if (node.startsWith('esp:L')) return [bx(BB_C0 + +node.slice(5)), ROW.b];
    if (node.startsWith('esp:R')) return [bx(BB_C0 + +node.slice(5)), ROW.i];
    if (node.startsWith('tela:')) { const k = TELA.findIndex(w => w.pin === node.slice(5)); return [TELA_X0 + TELA_P * k, TELA_Y]; }
    if (node.startsWith('mic:')) { const k = MIC.findIndex(w => w.pin === node.slice(4)); return [bx(MIC_C0 + k), ROW.e]; }
    return [0, 0];
  }
  function wirePath(e) {
    // fios da tela vem de baixo; fios da protoboard ficam acima dos furos
    if (e.mod === 'tela') {
      const [x1, y1] = physXY(e.a), [x2, y2] = e.b.startsWith('rail:') ? [bx(e.net === '3V3' ? 2 : 3), RAIL_Y[e.net]] : physXY(e.b);
      return { d: `M${x1} ${y1} C${x1} ${y1 - 70} ${x2} ${y2 + 70} ${x2} ${y2}`, p1: [x1, y1], p2: [x2, y2] };
    }
    if (e.b.startsWith('rail:')) { const [x1] = physXY(e.a); const y2 = RAIL_Y[e.net]; return { d: `M${x1} ${ROW.a} V${y2}`, p1: [x1, ROW.a], p2: [x1, y2] }; }
    const [x1] = physXY(e.a), [x2] = physXY(e.b), dd = 26 + 7 * (e.k || 0);
    return { d: `M${x1} ${ROW.a} C${x1} ${ROW.a + dd} ${x2} ${ROW.a + dd} ${x2} ${ROW.a}`, p1: [x1, ROW.a], p2: [x2, ROW.a] };
  }

    const lab = (x, y, t, anchor, on) => `<text x="${x}" y="${y + 3.5}" text-anchor="${anchor}" style="${F};opacity:${boxOp(on)}">${t}</text>`;
    // tela: VCC e GND (nomes do modulo)
    s += lab(SYM.xT - 8, symY(0), 'VCC', 'end', 'tela') + pw('w.tela.VCC', SYM.xT, symY(0), '3V3', 1);
    s += lab(SYM.xT - 8, symY(12), 'GND', 'end', 'tela') + pw('w.tela.GND', SYM.xT, symY(12), 'GND', 1);
    s += lab(SYM.xE + 8, symY(0), '3V3', 'start', 'esp') + pw('w.esp3v3', SYM.xE, symY(0), '3V3', -1);
    s += lab(SYM.xE + 8, symY(12), 'GND', 'start', 'esp') + pw('w.espgnd', SYM.xE, symY(12), 'GND', -1);
    // sinais da tela: fio reto horizontal, pino da tela -> GPIO
    SYM_SIG.forEach(([pin, g], k) => {
      const y = symY(k + 1), id = `w.tela.${pin}`, e = E[id], col = busColor(e.bus, e.net);
      s += lab(SYM.xT - 8, y, pin, 'end', 'tela') + lab(SYM.xE + 8, y, `GPIO ${g}`, 'start', 'esp');
      s += wireG(id, `M${SYM.xT} ${y} H${SYM.xE}`, col, `<circle cx="${SYM.xT}" cy="${y}" r="3.2" fill="${col}"/><circle cx="${SYM.xE}" cy="${y}" r="3.2" fill="${col}"/>`);
    });
    // microfone
    SYM_MIC.forEach(([pin, g], k) => {
      const y = symY(k + 3), id = `w.mic.${pin}`, e = E[id];
      s += lab(SYM.xM + 8, y, pin, 'start', 'mic');
      if (g) { const col = busColor(e.bus, e.net); s += lab(SYM.xE2 - 8, y, `GPIO ${g}`, 'end', 'esp') + wireG(id, `M${SYM.xE2} ${y} H${SYM.xM}`, col, `<circle cx="${SYM.xE2}" cy="${y}" r="3.2" fill="${col}"/><circle cx="${SYM.xM}" cy="${y}" r="3.2" fill="${col}"/>`); }
      else s += pw(id, SYM.xM, y, pin === 'VDD' ? '3V3' : 'GND', -1);
    });
    // USB e pull-ups
    const yU = symY(12) + 56, usb = usbNow();
    s += `<line x1="${SYM.xE + 80}" y1="${yU}" x2="${SYM.xE + 80}" y2="${symY(12) + 30}" stroke="${usb ? 'var(--w-pwr)' : 'var(--muted)'}" stroke-width="2.4"${usb ? '' : ' stroke-dasharray="4 3"'}/><rect x="${SYM.xE + 20}" y="${yU}" width="120" height="26" rx="4" fill="${usb ? 'var(--w-pwr)' : 'var(--surface2)'}" stroke="var(--fg)"${usb ? '' : ' stroke-dasharray="4 3"'}/><text x="${SYM.xE + 80}" y="${yU + 17}" text-anchor="middle" style="${F};fill:${usb ? '#fff' : 'var(--muted)'}">USB 5 V ${usb ? 'ligado' : 'desligado'}</text>`;
    s += `<text class="t-dim" x="30" y="${symY(12) + 72}" style="${F}">Dentro do módulo, SDA e SCL têm um resistor pull-up</text><text class="t-dim" x="30" y="${symY(12) + 86}" style="${F}">de cerca de 4,7 kΩ até o 3V3 (não são peças suas).</text>`;
    s += `<text class="t-dim" x="30" y="30" style="font-size:11px">Linha reta = fio ligado. Símbolo com 3 traços = terra (GND). Símbolo com 1 traço = alimentação (+3V3).</text>`;
    // pontos de medida
    Object.entries(P).forEach(([n, [x, y]]) => { if ((n === 'esp:L1')) return; s += pointEl(n, x, y, 7); });
    s += probeMarks(n => P[n] || null);
    return `<svg id="svg" class="${S.zoom === 1 ? 'fit' : ''}" viewBox="0 0 900 ${symY(12) + 110}" width="${Math.round(900 * S.zoom)}" role="img" aria-label="Esquema elétrico com símbolos: os pinos do ESP32 ligados aos pinos da tela e do microfone por fios retos, com símbolos de alimentação e de terra">${s}</svg>`;
  }

  // =====================================================================================
  // 6. PAINEIS
  // =====================================================================================
  const VIEWHINT = { phys: 'Clique em um ponto do desenho (furo, pino ou trilho) para encostar a ponta do multímetro virtual. A primeira ponta é a vermelha, a segunda é a preta.',
    blocks: 'Mesmo circuito, mostrando quem fala com quem. Clique nos pinos para medir.', sym: 'Mesmo circuito como esquema elétrico. Os pinos aparecem agrupados por função, não pela ordem física. Clique nos pinos para medir.' };
  function renderLegend() {
    $('legend').innerHTML = `<span><i style="background:var(--w-spi)"></i>SPI</span><span><i style="background:var(--w-i2c)"></i>I2C</span><span><i style="background:var(--w-i2s)"></i>I2S</span><span><i style="background:var(--w-pwr)"></i>3V3</span><span><i style="background:var(--w-gnd)"></i>GND</span><span><i class="gh"></i>ainda não montado</span><span style="color:var(--bad)"><i style="background:none;border-top:2px dashed var(--bad);height:0"></i>desligado por você</span>`;
  }
  function renderCanvas() {
    $('canvas').innerHTML = S.view === 'phys' ? drawPhys() : S.view === 'blocks' ? drawBlocks() : drawSym();
    $('viewhint').textContent = VIEWHINT[S.view];
    document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
    document.querySelectorAll('#zoom button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.z === S.zoom)));
  }
  function renderSteps() {
    let html = '', last = -1;
    STEPS.forEach(st => {
      if (st.stage !== last) { html += `<div class="stage-name">${STAGES[st.stage].name}</div>`; last = st.stage; }
      html += `<button type="button" class="step-btn${S.done.includes(st.idx) ? ' done' : ''}" data-step="${st.idx}" ${st.idx === S.cur ? 'aria-current="step"' : ''}><span class="n">${st.idx + 1}</span><span class="t">${esc(st.title)}${st.optional ? ' (opcional)' : ''}</span></button>`;
    });
    $('steps').innerHTML = html;
    $('progress').style.width = `${Math.round(100 * S.done.length / STEPS.length)}%`;
  }
  function renderParts() {
    let html = '';
    STAGES.slice(1).forEach(sg => {
      const ids = Object.keys(E).filter(id => E[id].stage === sg.id); if (!ids.length) return;
      html += `<div class="parts-grp"><h3>${sg.name}</h3>` + ids.map(id => { const e = E[id], st = elState(id);
        return `<div class="part${curIds().has(id) ? ' cur' : ''}"><button type="button" class="sw" role="switch" aria-checked="${effOn(id)}" aria-label="${esc(e.label)}" data-sw="${id}"></button><span>${esc(e.label)}<small>${st === 'on' ? 'ativo' : st === 'future' ? 'ainda não montado neste passo' : '<span class="off">desligado por você</span>'}</small></span></div>`; }).join('') + `</div>`;
    });
    $('parts').innerHTML = html;
    const offs = Object.keys(E).filter(id => elState(id) === 'off');
    $('conseq').innerHTML = offs.length ? `<div class="note bad"><b>O que deixa de funcionar:</b><ul style="margin:6px 0 0;padding-left:18px">${offs.map(id => `<li><b>${esc(E[id].label)}.</b> ${rich(E[id].cons)}</li>`).join('')}</ul></div>` : `<p class="hint">Nada desligado por você. Desligue uma peça para ver a consequência.</p>`;
  }
  function renderMeter() {
    const on = onSet(), nets = buildNets(on, usbNow());
    const avail = n => { if (n.startsWith('esp:')) return on.has('esp'); if (n.startsWith('tela:')) return on.has('tela'); if (n.startsWith('mic:')) return on.has('mic'); return true; };
    const opts = (cur) => {
      const groups = [['Trilhos', ['rail:3V3', 'rail:GND']], ['ESP32 (lado esquerdo)', LEFT.map((p, i) => `esp:L${i}`)], ['Tela', TELA.map(w => `tela:${w.pin}`)], ['Microfone', MIC.map(w => `mic:${w.pin}`)], ['Furos livres', Array.from({ length: 22 }, (_, i) => `bbB:${BB_C0 + i}`).concat(Array.from({ length: 6 }, (_, i) => `bbB:${MIC_C0 + i}`))]];
      return '<option value="">(nenhum)</option>' + groups.map(([g, ns]) => `<optgroup label="${g}">` + ns.filter(avail).map(n => `<option value="${n}"${cur === n ? ' selected' : ''}>${esc(POINT_LABEL[n])}</option>`).join('') + '</optgroup>').join('');
    };
    let readout = '<div class="mm-explain hint">Escolha dois pontos (clicando no desenho ou nas listas) para ver a leitura.</div>', lcd = '——', unit = '', beepOn = false, warn = '';
    if (S.red && S.black && avail(S.red) && avail(S.black)) {
      const m = measure(nets, S.mode, S.red, S.black); lcd = m.disp; unit = m.unit; beepOn = m.beep;
      readout = `<div class="mm-explain">${esc(m.why)}</div>`;
      if (S.mode === 'cont' && m.warnPower) warn = '<div class="warn">Atenção: com o USB ligado, o modo continuidade não é confiável. No mundo real, desligue o USB antes.</div>';
      if (m.warn) warn = '<div class="warn">Curto detectado. Desligue o USB.</div>';
    }
    $('mm').innerHTML = `<h3>Multímetro virtual</h3>
      <div class="mm-body">
        <div class="mm-lcd"><small>${S.mode === 'cont' ? 'CONTINUIDADE' : 'TENSÃO V⎓'}<br>${usbNow() ? 'USB ligado' : 'USB desligado'}</small><span>${lcd}<small style="display:inline;margin-left:6px">${unit}</small></span></div>
        <div class="seg2" role="group" aria-label="Modo"><button type="button" data-mode="volt" aria-pressed="${S.mode === 'volt'}">Tensão (V⎓)</button><button type="button" data-mode="cont" aria-pressed="${S.mode === 'cont'}">Continuidade (apita)</button></div>
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="beep${beepOn ? ' on' : ''}">${beepOn ? 'BIIIP' : 'silêncio'}</span>
          <label style="font-size:12px;color:#e3e6ea;display:flex;gap:6px;align-items:center"><input type="checkbox" id="usbsw" ${usbNow() ? 'checked' : ''}> cabo USB ligado</label></div>
      </div>
      <label class="fld"><span><span class="probe-dot" style="background:var(--bad)"></span>Ponta vermelha</span><select id="selRed">${opts(S.red)}</select></label>
      <label class="fld"><span><span class="probe-dot" style="background:#111"></span>Ponta preta</span><select id="selBlack">${opts(S.black)}</select></label>
      <div style="display:flex;gap:8px"><button type="button" class="btn" id="swapP">Inverter pontas</button><button type="button" class="btn" id="clearP">Limpar</button></div>
      ${readout}${warn}`;
  }

  function codeText(id) { const el = document.getElementById('code-' + id); return el ? el.textContent : ''; }
  function pinTable(buses) {
    const rows = Object.values(E).filter(e => e.kind === 'wire' && e.gpio && buses.includes(e.bus)).map(e => `<tr><td><code>${e.mod === 'tela' ? 'Tela' : 'Microfone'} ${e.pin}</code></td><td><code>GPIO ${e.gpio}</code></td><td>${rich(e.why)}</td></tr>`).join('');
    return `<div class="tbl"><table><thead><tr><th>Fio</th><th>Número no código</th><th>Para quê</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function renderStep() {
    const st = STEPS[S.cur], typeLabel = { info: 'Entender', place: 'Posicionar', wire: 'Ligar um fio', test: 'Testar', action: 'Medir', code: 'Programa' }[st.type];
    const reqKey = `${st.idx}`;
    let h = `<div class="step-head"><span class="badge">${STAGES[st.stage].name}</span><span class="badge">${typeLabel}</span>${st.optional ? '<span class="badge opt">opcional</span>' : ''}<span class="hint">passo ${st.idx + 1} de ${STEPS.length}</span></div><h2>${esc(st.title)}</h2>`;
    if (st.do) h += `<div class="sec"><h3>O que fazer</h3><ul>${st.do.map(t => `<li>${rich(t)}</li>`).join('')}</ul></div>`;
    if (st.why) h += `<div class="sec"><h3>Por quê</h3><p>${rich(st.why)}</p></div>`;
    if (st.verify) {
      const v = st.verify, nom = nominalSet(S.cur), nets = buildNets(nom, v.usb), m = measure(nets, v.mode, v.a, v.b), answered = S.ans[reqKey];
      const choices = v.mode === 'cont' ? ['Apita (ligados)', 'Não apita (separados)'] : ['0 V', '3,3 V', '5 V'];
      const right = resultLabel(v.mode, m);
      h += `<div class="sec"><h3>Como verificar no multímetro</h3>
        <p>Modo <b>${v.mode === 'cont' ? 'continuidade' : 'tensão contínua (V⎓)'}</b>, com o USB <b>${v.usb ? 'ligado' : 'desligado'}</b>. Ponta vermelha em <b>${esc(POINT_LABEL[v.a])}</b>, preta em <b>${esc(POINT_LABEL[v.b])}</b>.</p>
        <p class="hint">Objetivo: ${rich(v.goal)}.</p>
        <p><b>Antes de medir, o que você espera?</b></p>
        <div class="opts" id="predict">${choices.map((c, i) => `<button type="button" class="opt${answered !== undefined ? (c === right ? ' right' : (answered === i ? ' wrong' : '')) : ''}" data-pred="${i}" data-choice="${esc(c)}" ${answered !== undefined ? 'disabled' : ''}>${esc(c)}</button>`).join('')}</div>`;
      if (answered !== undefined) {
        const ok = choices[answered] === right;
        h += `<div class="note ${ok ? 'good' : 'bad'}"><b>${ok ? 'Acertou.' : 'Quase.'}</b> O esperado é <b>${esc(right)}</b>. ${esc(m.why)}</div>
          <div class="nav"><button type="button" class="btn primary" data-act="show">Mostrar no multímetro</button><button type="button" class="btn" data-act="report">Não bateu</button></div>`;
        if (st.counter) { const c = st.counter, cm = measure(buildNets(nom, c.usb), c.mode, c.a, c.b); h += `<p class="hint">Contraprova: ${rich(c.goal)}. Esperado: <b>${esc(resultLabel(c.mode, cm))}</b>. <button type="button" class="btn" data-act="showc">Mostrar no multímetro</button></p>`; }
      }
      h += `</div>`;
    }
    if (st.type === 'code') {
      h += `<div class="sec"><h3>Programa</h3>${st.flag ? `<p class="note">Neste passo, deixe <code>#define ${st.flag}</code> no começo do programa.</p>` : ''}
        <div class="codewrap"><div class="cap"><span>${esc(st.code)}.ino</span><button type="button" data-copy="${st.code}">Copiar</button></div><pre class="code"><code>${esc(codeText(st.code))}</code></pre></div></div>`;
      h += `<div class="sec"><h3>Os fios que o programa usa</h3>${pinTable(st.showPins || [])}</div>`;
      h += `<div class="sec"><h3>O programa, bloco a bloco</h3>${st.blocks.map(([c, n]) => `<div class="block"><pre class="mini"><code>${esc(c)}</code></pre><p>${rich(n)}</p></div>`).join('')}</div>`;
      h += `<div class="sec"><h3>Passou quando</h3><div class="note good">${rich(st.ok)}</div>
        <details><summary>Se não passar</summary><div class="tbl"><table><tbody>${st.fail.map(([a, b]) => `<tr><td><b>${esc(a)}</b></td><td>${rich(b)}</td></tr>`).join('')}</tbody></table></div></details>
        <div class="nav"><button type="button" class="btn" data-act="report">Não bateu</button></div></div>`;
    }
    if (st.ifNot) h += `<div class="sec"><h3>${st.type === 'wire' ? 'Se este fio ficar de fora' : st.type === 'info' ? 'Se você pular isto' : 'O que acontece se der errado'}</h3><div class="note bad">${rich(st.ifNot)}</div></div>`;
    if (S.report) h += reportBox(st);
    h += `<div class="nav" style="padding-top:10px;border-top:1px solid var(--line)"><button type="button" class="btn" data-act="prev" ${S.cur === 0 ? 'disabled' : ''}>← Passo anterior</button>
      <button type="button" class="btn" data-act="done">${S.done.includes(S.cur) ? 'Desmarcar como feito' : 'Marcar como feito'}</button>
      <button type="button" class="btn primary" data-act="next" ${S.cur === STEPS.length - 1 ? 'disabled' : ''}>Próximo passo →</button></div>
      <p class="hint">Atalhos: setas ← → mudam de passo.</p>`;
    $('stepcard').innerHTML = h;
  }
  function reportBox(st) {
    return `<div class="sec"><h3>Relatório "Não bateu"</h3>
      <label class="fld">O que você mediu ou viu<textarea id="rpMed" rows="2" placeholder="Ex.: marcou 0,00 e não apitou"></textarea></label>
      <label class="fld">O que você estranhou (opcional)<textarea id="rpObs" rows="2"></textarea></label>
      <div class="nav"><button type="button" class="btn primary" data-act="mkreport">Gerar resumo</button><button type="button" class="btn" data-act="closereport">Fechar</button></div>
      <textarea id="rpOut" rows="10" readonly placeholder="O resumo aparece aqui. Copie e cole na conversa."></textarea><button type="button" class="btn" data-act="copyreport">Copiar resumo</button></div>`;
  }
  function makeReport() {
    const st = STEPS[S.cur], on = onSet(), nets = buildNets(on, usbNow());
    const parts = Object.keys(E).filter(id => effOn(id)).map(id => E[id].label);
    const off = Object.keys(E).filter(id => elState(id) === 'off').map(id => E[id].label);
    let probe = 'sem pontas escolhidas', got = '';
    if (S.red && S.black) { const m = measure(nets, S.mode, S.red, S.black); probe = `${S.mode === 'cont' ? 'continuidade' : 'tensão'} · vermelha: ${POINT_LABEL[S.red]} · preta: ${POINT_LABEL[S.black]}`; got = `multímetro virtual mostrava ${pt(m.disp)} ${m.unit}`; }
    const exp = st.verify ? (() => { const v = st.verify, m = measure(buildNets(nominalSet(S.cur), v.usb), v.mode, v.a, v.b); return `${POINT_LABEL[v.a]} ↔ ${POINT_LABEL[v.b]}: ${resultLabel(v.mode, m)} (USB ${v.usb ? 'ligado' : 'desligado'})`; })() : 'este passo não tem medida';
    return `Manual do mascote · relatório\nEtapa: ${STAGES[st.stage].name}\nPasso ${st.idx + 1} de ${STEPS.length}: ${st.title}\nUSB: ${usbNow() ? 'ligado' : 'desligado'}\nPeças e fios ativos: ${parts.join('; ') || 'nenhum'}\n${off.length ? 'Desligados por mim no manual: ' + off.join('; ') + '\n' : ''}Esperado: ${exp}\nMultímetro virtual: ${probe}${got ? ' (' + got + ')' : ''}\nO que eu medi/vi de verdade: ${($('rpMed') || {}).value || '(não preenchido)'}\nObservações: ${($('rpObs') || {}).value || '-'}`;
  }

  function renderAll() { renderSteps(); renderCanvas(); renderStep(); renderParts(); renderMeter(); renderLegend(); save(); }

  // =====================================================================================
  // 7. EVENTOS
  // =====================================================================================
  const go = k => { S.cur = Math.max(0, Math.min(STEPS.length - 1, k)); S.usbOv = null; S.report = false; renderAll(); window.scrollTo({ top: 0 }); };
  const setProbe = node => {
    if (S.pick === 'red') { S.red = node; S.pick = 'black'; } else { S.black = node; S.pick = 'red'; }
    renderCanvas(); renderMeter();
  };
  document.addEventListener('click', e => {
    const t = e.target.closest('button, .pt, .gl'); if (!t) { hideGl(); return; }
    if (t.classList.contains('gl')) { showGl(t); return; }
    hideGl();
    if (t.classList.contains('pt')) { setProbe(t.dataset.node); return; }
    if (t.dataset.step !== undefined) return go(+t.dataset.step);
    if (t.dataset.sw) { const id = t.dataset.sw, nom = nominalOn(id), cur = effOn(id); if (!cur === nom) delete S.ov[id]; else S.ov[id] = !cur; renderAll(); return; }
    if (t.dataset.view) { S.view = t.dataset.view; renderAll(); return; }
    if (t.dataset.z) { S.zoom = +t.dataset.z; renderAll(); return; }
    if (t.dataset.mode) { S.mode = t.dataset.mode; renderMeter(); return; }
    if (t.dataset.pred !== undefined) { S.ans[`${S.cur}`] = +t.dataset.pred; renderStep(); save(); return; }
    if (t.dataset.copy) { const txt = codeText(t.dataset.copy), old = t.textContent; const done = ok => { t.textContent = ok ? 'Copiado' : 'Selecione e copie'; setTimeout(() => (t.textContent = old), 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => done(true), () => { selectIn(t.closest('.codewrap').querySelector('code')); done(false); }); else { selectIn(t.closest('.codewrap').querySelector('code')); done(false); } return; }
    switch (t.dataset.act) {
      case 'prev': return go(S.cur - 1);
      case 'next': if (!S.done.includes(S.cur)) S.done.push(S.cur); return go(S.cur + 1);
      case 'done': S.done = S.done.includes(S.cur) ? S.done.filter(x => x !== S.cur) : S.done.concat(S.cur); return renderAll();
      case 'show': case 'showc': { const v = t.dataset.act === 'show' ? STEPS[S.cur].verify : STEPS[S.cur].counter; S.mode = v.mode; S.red = v.a; S.black = v.b; S.pick = 'red'; S.usbOv = v.usb; renderAll(); return; }
      case 'report': S.report = true; renderStep(); document.getElementById('rpMed') && document.getElementById('rpMed').focus(); return;
      case 'closereport': S.report = false; return renderStep();
      case 'mkreport': $('rpOut').value = makeReport(); return;
      case 'copyreport': { const o = $('rpOut'); if (!o.value) o.value = makeReport(); o.select(); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(o.value).catch(() => {}); return; }
    }
    if (t.id === 'resetOv') { S.ov = {}; S.usbOv = null; return renderAll(); }
    if (t.id === 'resetAll') { S.cur = 0; S.done = []; S.ov = {}; S.usbOv = null; S.ans = {}; S.red = S.black = null; return renderAll(); }
    if (t.id === 'swapP') { [S.red, S.black] = [S.black, S.red]; return renderAll(); }
    if (t.id === 'clearP') { S.red = S.black = null; S.pick = 'red'; return renderAll(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'selRed') { S.red = e.target.value || null; renderCanvas(); renderMeter(); }
    if (e.target.id === 'selBlack') { S.black = e.target.value || null; renderCanvas(); renderMeter(); }
    if (e.target.id === 'usbsw') { S.usbOv = e.target.checked; renderAll(); }
  });
  document.addEventListener('keydown', e => {
